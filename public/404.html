<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ExpHub</title>
    <script>
      // GitHub Pages has no server-side router, so a direct load of a route
      // like /exphub/admin 404s. This re-encodes the path into a query
      // string, redirects to index.html, and index.html's inline script
      // decodes it back before the SPA router mounts.
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
